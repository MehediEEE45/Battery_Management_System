# Render "Blueprint" — lets Render auto-configure the service from this file.
# Deploy: render.com → New + → Blueprint → pick this repo → Render reads this file.
# Env vars marked `sync: false` are prompted for during setup and stored only
# in Render's dashboard — never written to this file or git.
services:
  - type: web
    name: bms-mqtt-bridge
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: MQTT_URL
        value: mqtts://0d34f5789e1e4a669367abfe5bd45b15.s1.eu.hivemq.cloud:8883
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false
      - key: MQTT_TOPIC_FILTER_3
        value: battery/data
      # Fixed client ID -> stable MQTT session instead of a new random one
      # per restart. It does NOT preserve telemetry across outages: the
      # ESP32 publishes at QoS 0 (PubSubClient limit) and brokers never
      # queue QoS 0 for disconnected subscribers. See server/README.md.
      # Not a secret; safe to hardcode.
      - key: MQTT_CLIENT_ID
        value: bms-render-bridge-1
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: battery_monitor
      - key: MONGO_COLLECTION
        value: telemetry
      - key: MONGO_TTL_DAYS
        value: "30"
